name: CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint & Format (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Ruff Format Checks
        run: ruff format --check .

  frontend-validate:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type checking & Vite production build
        run: npm run build

  docker-build:
    name: Build Backend Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend-lint, frontend-validate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build backend Docker image (dry-run verify)
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: backend-learning-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
