services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_backend_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Backend Learning Platform API
      - APP_ENV=development
      - DEBUG=True
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/task_management.db
      - JWT_SECRET_KEY=development_secret_key_needs_to_be_at_least_32_chars_long_12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=120
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      # Persistent volume for SQLite data to prevent database loss across container restarts
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: task_backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local

